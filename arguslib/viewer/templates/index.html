<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>arguslib viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>arguslib viewer</h1>
    <span id="status" class="status"></span>
  </header>

  <main>
    <section class="controls">
      <label>Instrument
        <select id="instrument"></select>
      </label>

      <label>Date (UTC, YYYY-MM-DD)
        <span class="date-field">
          <input type="text" id="date" inputmode="numeric"
                 pattern="\d{4}-\d{2}-\d{2}" placeholder="YYYY-MM-DD" maxlength="10" />
          <!-- Native date input overlaid transparently on the calendar button so
               the browser opens AND closes its own picker. Its value is ISO, so
               syncing it back keeps the text field as YYYY-MM-DD. -->
          <span class="date-pick" title="Pick date from calendar">📅
            <input type="date" id="date-native" aria-label="Pick date from calendar" />
          </span>
        </span>
      </label>

      <label>Time <span id="time-readout" class="mono"></span>
        <!-- min=1/step=5 keeps 5s arrow steps while letting the default land on :06 -->
        <input type="range" id="time" min="1" max="86396" step="5" value="26706" />
      </label>

      <label>Assumed feature altitude: <span id="alt-readout" class="mono">10.0 km</span>
        <input type="range" id="altitude" min="0.5" max="15" step="0.1" value="10" />
      </label>

      <label class="check">
        <input type="checkbox" id="aircraft-toggle" /> Overlay aircraft (ADS-B)
      </label>
      <label>Trail length: <span id="tlen-readout" class="mono">30 min</span>
        <input type="range" id="tlen" min="5" max="120" step="5" value="30" />
      </label>

      <p class="hint">Click the image to geolocate at the assumed altitude, or a
        flight track to identify the aircraft.</p>
    </section>

    <section class="viewport">
      <canvas id="canvas" width="800" height="800"></canvas>
    </section>

    <section class="readout">
      <h2>Fix</h2>
      <table>
        <tr><th>lon</th><td id="r-lon" class="mono">—</td></tr>
        <tr><th>lat</th><td id="r-lat" class="mono">—</td></tr>
        <tr><th>alt</th><td id="r-alt" class="mono">—</td></tr>
        <tr><th>elev</th><td id="r-elev" class="mono">—</td></tr>
        <tr><th>azim</th><td id="r-azim" class="mono">—</td></tr>
        <tr><th>range</th><td id="r-range" class="mono">—</td></tr>
        <tr><th>back-proj err</th><td id="r-err" class="mono">—</td></tr>
      </table>
      <button id="copy">Copy lon,lat</button>
      <p id="warn" class="warn"></p>
      <div id="aircraft-info" class="aircraft-info"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
